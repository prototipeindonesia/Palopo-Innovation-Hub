<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palopo Innovation Hub - Demo Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    .sidebar { transition: all 0.3s; }
    .active-menu { background: #1e3a8a; color: white; border-radius: 12px; }
    .leaflet-container { border-radius: 16px; z-index: 0; }
  </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen overflow-hidden">
  <!-- SIDEBAR -->
  <aside class="sidebar w-72 bg-white shadow-xl flex-shrink-0 overflow-y-auto">
    <div class="p-6 border-b">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-blue-700 rounded-xl flex items-center justify-center"><i class="fas fa-microchip text-white text-xl"></i></div>
        <div><h1 class="text-xl font-bold">Palopo<br><span class="text-blue-700 text-sm">Innovation Hub</span></h1></div>
      </div>
    </div>
    <nav class="p-4 space-y-2" id="navMenu"></nav>
    <div class="p-3 mt-8 border-t">
      <div class="flex items-center gap-3">
        <i class="fas fa-user-circle text-2xl text-blue-700"></i>
        <div class="flex-1">
          <p class="text-sm font-semibold" id="userNameDisplay">-</p>
          <p class="text-xs text-gray-500" id="userRoleDisplay">-</p>
        </div>
        <button id="logoutBtn" class="text-red-500"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto bg-gray-50 p-6" id="pageContent">
    <div class="flex justify-center items-center h-96">Memuat...</div>
  </main>
</div>

<script>
  // ======================== MOCK DATA (Backend Simulasi) ========================
  let currentUser = { id: 1, name: "Admin Demo", email: "admin@palopo.go.id", role: "admin_inovasi", opd_name: "Bappeda" };
  let inovasiList = [
    { id: 1, nama: "E-Learning Palopo", tahapan: "Penerapan", jenis: "Digital", bentuk: "Pelayanan Publik", titik_koordinat: "-3.0,120.2", urusan: "Pendidikan", opd_nama: "Dinas Pendidikan", skor_kemanfaatan: 85, skor_kualitas: 90, skor_kecepatan: 80 },
    { id: 2, nama: "Sistem Parkir Pintar", tahapan: "Penerapan", jenis: "Digital", bentuk: "Tata Kelola", titik_koordinat: "-2.98,120.18", urusan: "Perhubungan", opd_nama: "Dinas Perhubungan", skor_kemanfaatan: 78, skor_kualitas: 82, skor_kecepatan: 75 },
    { id: 3, nama: "Layanan Adm Desa Online", tahapan: "Penerapan", jenis: "Digital", bentuk: "Pelayanan Publik", titik_koordinat: "-3.02,120.22", urusan: "Desa", opd_nama: "Dinas Pemberdayaan Masyarakat", skor_kemanfaatan: 92, skor_kualitas: 88, skor_kecepatan: 85 }
  ];
  let lombaList = [{ id: 1, nama: "Inovasi Palopo 2026", periode: "Jan-Jun 2026", status: "Aktif" }];
  let spdRincian = Array(15).fill().map(() => ({ nilai: (Math.random() * 3 + 2).toFixed(1) }));
  let spdTotal = spdRincian.reduce((a,b) => a + parseFloat(b.nilai), 0);

  function hitungIID() {
    const totalInovasi = inovasiList.length;
    const cukupUrusan = true; // asumsi
    const skorJumlah = cukupUrusan ? Math.min(totalInovasi, 200) * 0.38 : 0;
    const avgSkor = inovasiList.reduce((a,i) => a + (i.skor_kemanfaatan + i.skor_kualitas + i.skor_kecepatan)/3, 0) / Math.max(1, totalInovasi);
    const sid = avgSkor + skorJumlah;
    const spd = Math.min(spdTotal, 63);
    const total = spd + sid;
    const indeks = (total / 250) * 100;
    let kategori = indeks > 65 ? "Sangat Inovatif" : (indeks > 40 ? "Inovatif" : "Kurang Inovatif");
    return { jumlahInovasi: totalInovasi, skorJumlah, sid, spd, totalSkor: total, indeksIID: indeks, kategori };
  }

  // ======================== RENDER DINAMIS ========================
  let currentPage = 'dashboard';
  let mapInstance = null;

  const menuItems = [
    { id: 'dashboard', label: 'Dashboard', icon: 'fas fa-tachometer-alt', roles: ['superadmin','admin_inovasi','opd','kepala_daerah','masyarakat'] },
    { id: 'input-inovasi', label: 'Input Inovasi', icon: 'fas fa-plus-circle', roles: ['superadmin','admin_inovasi','opd'] },
    { id: 'bank-inovasi', label: 'Bank Inovasi', icon: 'fas fa-database', roles: ['superadmin','admin_inovasi','opd','kepala_daerah','masyarakat'] },
    { id: 'lomba', label: 'Lomba Inovasi', icon: 'fas fa-trophy', roles: ['superadmin','admin_inovasi','opd','masyarakat'] },
    { id: 'data-tahunan', label: 'Data Tahunan', icon: 'fas fa-chart-line', roles: ['superadmin','admin_inovasi','kepala_daerah'] },
    { id: 'hki', label: 'HKI', icon: 'fas fa-copyright', roles: ['superadmin','admin_inovasi'] },
    { id: 'monev', label: 'Monev', icon: 'fas fa-clipboard-list', roles: ['superadmin','admin_inovasi','opd'] },
    { id: 'e-bimtek', label: 'E-Bimtek', icon: 'fas fa-chalkboard-teacher', roles: ['superadmin','admin_inovasi','opd','masyarakat'] },
    { id: 'spd', label: 'SPD', icon: 'fas fa-building', roles: ['superadmin','admin_inovasi'] },
    { id: 'panduan', label: 'Panduan', icon: 'fas fa-question-circle', roles: ['superadmin','admin_inovasi','opd','masyarakat'] }
  ];

  function renderSidebar() {
    const role = currentUser.role;
    const filtered = menuItems.filter(m => m.roles.includes(role));
    const html = filtered.map(m => `
      <a href="#" data-page="${m.id}" class="menu-link flex items-center gap-3 px-4 py-3 text-gray-700 rounded-xl hover:bg-blue-50 ${currentPage === m.id ? 'active-menu bg-blue-700 text-white' : ''}">
        <i class="${m.icon} w-5"></i><span>${m.label}</span>
      </a>
    `).join('');
    document.getElementById('navMenu').innerHTML = html;
    document.querySelectorAll('.menu-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        currentPage = link.dataset.page;
        renderSidebar();
        loadPage(currentPage);
      });
    });
    document.getElementById('userNameDisplay').innerText = currentUser.name;
    document.getElementById('userRoleDisplay').innerText = currentUser.role;
  }

  async function loadPage(page) {
    const container = document.getElementById('pageContent');
    container.innerHTML = '<div class="flex justify-center"><div class="animate-spin h-10 w-10 border-4 border-blue-700 rounded-full border-t-transparent"></div></div>';
    if (page === 'dashboard') await renderDashboard(container);
    else if (page === 'input-inovasi') await renderInputInovasi(container);
    else if (page === 'bank-inovasi') await renderBankInovasi(container);
    else if (page === 'lomba') await renderLomba(container);
    else if (page === 'data-tahunan') await renderDataTahunan(container);
    else if (page === 'hki') await renderHKI(container);
    else if (page === 'monev') await renderMonev(container);
    else if (page === 'e-bimtek') await renderEBimtek(container);
    else if (page === 'spd') await renderSPD(container);
    else if (page === 'panduan') await renderPanduan(container);
    else container.innerHTML = '<div class="bg-white p-6 rounded">Halaman tidak ditemukan</div>';
  }

  async function renderDashboard(container) {
    const iga = hitungIID();
    const top3 = [...inovasiList].sort((a,b) => (b.skor_kemanfaatan+b.skor_kualitas+b.skor_kecepatan) - (a.skor_kemanfaatan+a.skor_kualitas+a.skor_kecepatan)).slice(0,3);
    const html = `
      <div class="space-y-6">
        <h2 class="text-2xl font-bold">Dashboard Inovasi Daerah</h2>
        <div class="grid md:grid-cols-4 gap-4">
          <div class="bg-white p-5 rounded-2xl shadow"><p class="text-gray-500">Indeks IID</p><p class="text-3xl font-bold">${iga.indeksIID.toFixed(2)}</p><span class="text-sm">${iga.kategori}</span></div>
          <div class="bg-white p-5 rounded-2xl shadow"><p>SPD (maks 63)</p><p class="text-3xl font-bold">${iga.spd.toFixed(1)}</p></div>
          <div class="bg-white p-5 rounded-2xl shadow"><p>SID</p><p class="text-3xl font-bold">${iga.sid.toFixed(1)}</p></div>
          <div class="bg-white p-5 rounded-2xl shadow"><p>Jml Inovasi</p><p class="text-3xl font-bold">${iga.jumlahInovasi}</p></div>
        </div>
        <div class="grid lg:grid-cols-2 gap-6">
          <div class="bg-white p-4 rounded-2xl"><div id="mapContainer" style="height:350px;"></div></div>
          <div class="bg-white p-4 rounded-2xl"><h3 class="font-semibold mb-3">🏆 3 Inovasi Terbaik</h3>${top3.map(i => `<div class="border-b py-2"><b>${i.nama}</b><br><span class="text-sm">${i.opd_nama} | Skor: ${((i.skor_kemanfaatan+i.skor_kualitas+i.skor_kecepatan)/3).toFixed(0)}</span></div>`).join('')}</div>
        </div>
      </div>
    `;
    container.innerHTML = html;
    if (mapInstance) mapInstance.remove();
    mapInstance = L.map('mapContainer').setView([-3.0, 120.2], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(mapInstance);
    inovasiList.forEach(i => {
      if (i.titik_koordinat) {
        let c = i.titik_koordinat.split(',').map(Number);
        if (c.length === 2) L.marker(c).addTo(mapInstance).bindPopup(`<b>${i.nama}</b><br>${i.opd_nama}`);
      }
    });
  }

  async function renderInputInovasi(container) {
    container.innerHTML = `
      <div class="bg-white rounded-2xl p-6 max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">➕ Input Inovasi Baru</h2>
        <form id="formInovasi" enctype="multipart/form-data">
          <div class="grid md:grid-cols-2 gap-4">
            <input name="nama" placeholder="Nama Inovasi *" class="border p-2 rounded" required>
            <select name="tahapan"><option>Penerapan</option><option>Uji Coba</option></select>
            <select name="jenis"><option>Digital</option><option>Non Digital</option></select>
            <select name="bentuk"><option>Pelayanan Publik</option><option>Tata Kelola</option></select>
            <input name="titik_koordinat" placeholder="-3.0,120.2">
            <textarea name="rancang_bangun" placeholder="Rancang bangun" rows="3"></textarea>
            <input name="urusan" placeholder="Urusan">
            <input type="file" name="foto" accept="image/*">
            <input type="file" name="video" accept="video/*">
          </div>
          <button type="submit" class="mt-4 bg-blue-700 text-white px-6 py-2 rounded-xl">Simpan (Demo)</button>
        </form>
        <p class="text-gray-400 text-sm mt-4">*Mode demo: data hanya tersimpan di memori sementara.</p>
      </div>
    `;
    document.getElementById('formInovasi').addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Demo: Inovasi akan ditambahkan (simulasi). Silakan refresh untuk melihat efek.");
      const newId = inovasiList.length + 1;
      const newInovasi = {
        id: newId,
        nama: e.target.nama.value,
        tahapan: e.target.tahapan.value,
        jenis: e.target.jenis.value,
        bentuk: e.target.bentuk.value,
        titik_koordinat: e.target.titik_koordinat.value,
        rancang_bangun: e.target.rancang_bangun.value,
        urusan: e.target.urusan.value,
        opd_nama: currentUser.opd_name || "OPD Demo",
        skor_kemanfaatan: 70,
        skor_kualitas: 70,
        skor_kecepatan: 70
      };
      inovasiList.push(newInovasi);
      alert("Inovasi berhasil ditambahkan (simulasi).");
    });
  }

  async function renderBankInovasi(container) {
    container.innerHTML = `
      <div class="bg-white rounded-2xl p-5">
        <h2 class="text-xl font-bold mb-3">📚 Bank Inovasi</h2>
        <div class="grid md:grid-cols-2 gap-4">
          ${inovasiList.map(i => `<div class="border p-3 rounded"><b>${i.nama}</b><p>${i.opd_nama}</p><button class="text-blue-600 text-sm" onclick="alert('Demo: Replikasi ke ${i.opd_nama}')">Replikasi</button></div>`).join('')}
        </div>
      </div>
    `;
  }

  async function renderLomba(container) {
    container.innerHTML = `
      <div class="bg-white rounded-2xl p-5">
        <h2 class="text-xl font-bold mb-3">🏆 Lomba Inovasi</h2>
        ${lombaList.map(l => `
          <div class="border p-4 rounded mb-4">
            <h3 class="font-bold">${l.nama}</h3>
            <p>Periode: ${l.periode} | Status: ${l.status}</p>
            <button class="bg-green-600 text-white px-3 py-1 rounded" onclick="alert('Demo: Pendaftaran berhasil')">Daftar</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function renderDataTahunan(container) {
    const tahunan = {2024:2,2025:4,2026:3};
    container.innerHTML = `
      <div class="bg-white p-5 rounded-2xl">
        <canvas id="trenChart" height="100"></canvas>
        <button id="exportExcel" class="mt-4 bg-green-600 text-white p-2 rounded">Ekspor Excel</button>
      </div>
    `;
    new Chart(document.getElementById('trenChart'), { type:'line', data:{ labels:['2024','2025','2026'], datasets:[{ label:'Jumlah Inovasi', data:[tahunan[2024],tahunan[2025],tahunan[2026]] }] } });
    document.getElementById('exportExcel').onclick = () => {
      const ws = XLSX.utils.json_to_sheet([{ Tahun:2024, Jumlah:tahunan[2024] },{ Tahun:2025, Jumlah:tahunan[2025] },{ Tahun:2026, Jumlah:tahunan[2026] }]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, 'data_inovasi.xlsx');
    };
  }

  async function renderHKI(container) { container.innerHTML = `<div class="bg-white p-5 rounded">📜 Modul HKI (demo) - Manajemen Hak Kekayaan Intelektual</div>`; }
  async function renderMonev(container) { container.innerHTML = `<div class="bg-white p-5 rounded">📋 Monev Inovasi (demo)</div>`; }
  async function renderEBimtek(container) { container.innerHTML = `<div class="bg-white p-5 rounded">🎓 E-Bimtek Inovasi (demo)</div>`; }
  async function renderSPD(container) {
    container.innerHTML = `
      <div class="bg-white p-5 rounded-2xl">
        <h2 class="text-xl font-bold">Skor SPD: ${spdTotal.toFixed(2)} / 63</h2>
        <div class="grid md:grid-cols-3 gap-2 mt-4">
          ${spdRincian.map((r,i) => `<div class="border p-2">Indikator ${i+1}: ${r.nilai}</div>`).join('')}
        </div>
      </div>
    `;
  }
  async function renderPanduan(container) {
    container.innerHTML = `<div class="bg-white p-5 rounded-2xl"><h2 class="text-xl font-bold">📘 Panduan & FAQ</h2><p>Halaman panduan penggunaan platform.</p></div>`;
  }

  // Login sederhana (tanpa backend)
  function showLogin() {
    const roleOptions = [
      { label: "Super Admin", role: "superadmin", name: "Super Admin", email:"superadmin@demo" },
      { label: "Admin Inovasi", role: "admin_inovasi", name: "Admin Inovasi", email:"admin@demo" },
      { label: "OPD", role: "opd", name: "Kepala Dinas Pendidikan", email:"opd@demo" },
      { label: "Kepala Daerah", role: "kepala_daerah", name: "Wali Kota Palopo", email:"kadia@demo" },
      { label: "Masyarakat", role: "masyarakat", name: "Warga Palopo", email:"user@demo" }
    ];
    const modal = document.createElement('div');
    modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50";
    modal.innerHTML = `
      <div class="bg-white rounded-2xl p-8 w-96">
        <h2 class="text-2xl font-bold text-center mb-4">Login Palopo Hub</h2>
        <select id="roleSelect" class="w-full border p-3 rounded mb-4">
          ${roleOptions.map(opt => `<option value="${opt.role}">${opt.label}</option>`).join('')}
        </select>
        <button id="loginBtn" class="w-full bg-blue-700 text-white py-2 rounded">Login Demo</button>
        <p class="text-xs text-gray-400 mt-4 text-center">Mode demo offline - data simulasi</p>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('loginBtn').onclick = () => {
      const selected = roleOptions.find(o => o.role === document.getElementById('roleSelect').value);
      currentUser = { name: selected.name, email: selected.email, role: selected.role, opd_name: selected.role === 'opd' ? 'Dinas Pendidikan' : 'Pemkot' };
      modal.remove();
      renderSidebar();
      loadPage('dashboard');
    };
  }

  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    currentUser = null;
    showLogin();
  });

  if (!currentUser) showLogin(); else { renderSidebar(); loadPage('dashboard'); }
</script>
</body>
</html>
